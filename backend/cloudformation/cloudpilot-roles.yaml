AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CloudPilot Hardened Two-Role IAM Architecture: Read-Only Discovery (Role 1)
  and Strictly Scoped Atomic Remediation (Role 2) with Mandatory ExternalId Trust.

Parameters:
  OperatorAccountId:
    Type: String
    Default: "999888777666"
    AllowedPattern: "^[0-9]{12}$"
    Description: AWS Account ID hosting CloudPilot platform operator services.
  ExternalId:
    Type: String
    MinLength: 16
    MaxLength: 128
    AllowedPattern: "^[a-zA-Z0-9_-]+$"
    Description: Unpredictable tenant ExternalId for sts:AssumeRole confused-deputy defense.

Resources:
  # ── Role 1: Strictly Read-Only Discovery ──────────────────────────────────────
  CloudPilotAuditRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudPilotAuditRole
      Description: Read-only role used by CloudPilot for continuous cost & security discovery.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnforceOperatorPrincipalWithExternalId
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${OperatorAccountId}:role/CloudPilotOperatorRole"
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/SecurityAudit"
        - "arn:aws:iam::aws:policy/job-function/ViewOnlyAccess"
      Tags:
        - Key: ManagedBy
          Value: CloudPilot
        - Key: Scope
          Value: AuditReadOnly

  # ── Role 2: Narrow Scoped Remediation (Assumed ONLY on explicit approval) ──────
  CloudPilotRemediationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudPilotRemediationRole
      Description: Scoped execution role assumed exclusively upon human Slide-to-Approve authorization.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnforceOperatorPrincipalWithExternalIdRemediation
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${OperatorAccountId}:role/CloudPilotOperatorRole"
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
      Policies:
        - PolicyName: AtomicRemediationPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # AWS EC2 Describe APIs require Resource: "*" because AWS does not support resource-level ARNs for Describe
              - Sid: DescribeSecurityGroupsVerification
                Effect: Allow
                Action:
                  - "ec2:DescribeSecurityGroups"
                Resource: "*"
              # Atomic mutation strictly scoped to Security Groups in the customer's own AWS account
              - Sid: ScopedRevokeSecurityGroupIngress
                Effect: Allow
                Action:
                  - "ec2:RevokeSecurityGroupIngress"
                Resource: !Sub "arn:aws:ec2:*:${AWS::AccountId}:security-group/*"
      Tags:
        - Key: ManagedBy
          Value: CloudPilot
        - Key: Scope
          Value: HumanApprovedRemediation

Outputs:
  AuditRoleArn:
    Description: ARN of the read-only discovery role
    Value: !GetAtt CloudPilotAuditRole.Arn
    Export:
      Name: CloudPilotAuditRoleArn

  RemediationRoleArn:
    Description: ARN of the human-authorized remediation role
    Value: !GetAtt CloudPilotRemediationRole.Arn
    Export:
      Name: CloudPilotRemediationRoleArn

  ExternalIdUsed:
    Description: ExternalId required in STS AssumeRole requests
    Value: !Ref ExternalId
