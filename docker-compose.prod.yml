version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CLOUDPILOT_ENV=production
      - CLOUDPILOT_AUTH_SECRET=${CLOUDPILOT_AUTH_SECRET}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-south-1}
      - OPERATOR_ACCOUNT_ID=${OPERATOR_ACCOUNT_ID}
      - OPERATOR_ROLE_ARN=${OPERATOR_ROLE_ARN}
      - CLOUDPILOT_DB_PATH=/app/data/cloudpilot.db
    volumes:
      - cloudpilot-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  cloudpilot-data:
    driver: local
